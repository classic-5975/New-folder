<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Layout</title>
</head>

<body>
    <header>
        <nav>
            <a href="/home">home</a>
            <a href="pages/about.html">about</a>
            <a href="https://www.instagram.com/classic.5975" target="_blank">My Instagram</a>
        </nav>
    </header>
    <!-- The main opening tag -->
    <main>
        <!-- A page section -->
        <section>
            <!-- A self-contained content -->
            <article>
                <!-- Content goes here -->
                <div>
                    I am conten inside div.
                </div>
                <div>
                    I am another div.
                </div>
                <span>
                    I am content inside span.
                </span>
                <span>
                    I am content inside another span.
                </span>
                <p>This is a <span>highlighted</span> word in a sentence.</p>
            </article>
        </section>
        <!-- Content aside from the main content (e.g. Ads, sidebars) -->
        <aside>
            <!-- Aside content goes here -->
        </aside>
    </main>
    <!-- The main closing tag -->
    <footer>This is footer tag.</footer>
</body>

</html>
